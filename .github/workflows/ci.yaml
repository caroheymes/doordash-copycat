name: DoorDash Fee Service CI - Pytest

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-test-pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print greeting
        run: echo "👋 Hello from Jedha!"

      - name: Build Docker Image
        run: docker build -t doordash .

      - name: Run container
        run: docker run -d -p 8080:8080 --name doordash-api doordash

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API to be ready on http://localhost:8080 ..."
          for i in {1..10}; do
            if curl -sSf http://localhost:8080/status/ > /dev/null; then
              echo "API is up ✅"
              exit 0
            fi
            echo "API not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "API failed to start ❌"
          docker logs doordash-api || true
          exit 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements-tests.txt

      - name: Run Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/